<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0B0F14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Summary">
  <title>Summary</title>
  <style>
    /*
      Theme tokens. Recolor the whole dashboard from this block.
      Coral, amber, and mint — swap any value and the panels follow.
    */
    :root {
      --bg: #0B0F14;
      --card: #161C24;
      --ring-move: #FF7847;
      --ring-exercise: #FFC24B;
      --ring-stand: #B8F7D4;
      --accent: #FFD166;
      --text: #FFFFFF;
      --text-dim: #9AA4B2;
      --line: color-mix(in srgb, var(--text) 10%, transparent);
      --radius: 28px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: clip;
      background:
        radial-gradient(900px 420px at 10% -10%, color-mix(in srgb, var(--ring-move) 8%, transparent), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: Bahnschrift, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    /* Page column. Paired cards live in .cols and collapse under 640px. */
    .dashboard {
      width: min(820px, 100%);
      margin: 0 auto;
      padding:
        calc(28px + env(safe-area-inset-top))
        calc(20px + env(safe-area-inset-right))
        calc(56px + env(safe-area-inset-bottom))
        calc(20px + env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    /* ---------- Header ---------- */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 4px 4px 6px;
    }

    .date {
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .title {
      margin-top: 2px;
      color: var(--text);
      font-size: 44px;
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.05;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: block;
      flex: none;
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--text) 14%, transparent);
    }

    .avatar-sm {
      width: 30px;
      height: 30px;
      box-shadow: none;
    }

    /* ---------- Cards ---------- */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px 22px 20px;
      -webkit-tap-highlight-color: transparent;
      transition: filter 180ms ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .card:hover {
        filter: brightness(1.14);
      }
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h2 {
      color: var(--text);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    .chevron {
      width: 18px;
      height: 18px;
      flex: none;
      color: var(--accent);
    }

    .eyebrow {
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 500;
    }

    .unit {
      font-size: 0.62em;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-left: 0.35em;
    }

    /* ---------- Activity rings ---------- */
    .activity {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 36px;
      padding: 26px 28px;
    }

    .rings {
      width: 196px;
      height: 196px;
      flex: none;
    }

    .rings svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ring-track,
    .ring-arc {
      fill: none;
      stroke-width: 16;
      stroke-linecap: round;
    }

    /* Dim full-circle tracks sit under the progress arcs. */
    .ring-track {
      opacity: 0.22;
    }

    .ring-move { stroke: var(--ring-move); }
    .ring-exercise { stroke: var(--ring-exercise); }
    .ring-stand { stroke: var(--ring-stand); }

    .tone-move { color: var(--ring-move); }
    .tone-exercise { color: var(--ring-exercise); }
    .tone-stand { color: var(--ring-stand); }

    /*
      Draw-on animation. Arcs start fully hidden (dashoffset = dash length)
      and the script eases the offset to 0 on load. Stagger is outer → inner.
    */
    .ring-arc {
      transition: stroke-dashoffset 1.15s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ring-arc.ring-move { transition-delay: 0.05s; }
    .ring-arc.ring-exercise { transition-delay: 0.16s; }
    .ring-arc.ring-stand { transition-delay: 0.28s; }

    /* Tight stack, vertically centered beside the rings — not stretched down the card. */
    .metrics {
      flex: none;
      align-self: center;
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: max-content;
      max-width: 100%;
      min-width: 0;
    }

    .metric {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .metric-label {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .metric-value {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* ---------- Stat cards ---------- */
    .eyebrow-stat {
      margin-top: 14px;
    }

    .stat-value {
      margin-top: 2px;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .stat-distance .stat-value {
      color: var(--accent);
    }

    .bars {
      --chart-h: 72px;
      height: var(--chart-h);
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(24, minmax(0, 1fr));
      align-items: end;
      gap: 3px;
    }

    .stat-steps .bar {
      background: color-mix(in srgb, var(--text) 68%, var(--ring-stand));
    }

    .stat-distance .bar {
      background: var(--accent);
    }

    .bar {
      width: 100%;
      max-width: 5px;
      justify-self: center;
      height: calc(var(--scale) * var(--chart-h));
      border-radius: 2px;
      transform: scaleY(0);
      transform-origin: bottom center;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: calc(var(--i) * 32ms);
    }

    @keyframes rise {
      to { transform: scaleY(1); }
    }

    /* ---------- Sessions + trainer ---------- */
    .session-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 18px;
    }

    .walk-orb {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      flex: none;
      display: grid;
      place-items: center;
      color: var(--accent);
      background: radial-gradient(
        circle at 50% 42%,
        color-mix(in srgb, var(--accent) 34%, transparent),
        color-mix(in srgb, var(--accent) 8%, transparent) 72%
      );
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent),
        0 0 22px color-mix(in srgb, var(--accent) 45%, transparent);
    }

    .walk-icon {
      width: 30px;
      height: 30px;
      display: block;
    }

    .session-name {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    .session-distance {
      margin-top: 2px;
      color: var(--accent);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .session-row .eyebrow {
      margin-top: 2px;
    }

    .tip-heading {
      margin-top: 14px;
      max-width: 18ch;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.25;
    }

    .byline {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 500;
    }

    .awards {
      padding-top: 20px;
      padding-bottom: 20px;
    }

    /* ---------- Activity log (added; existing cards are unchanged) ---------- */
    .log-form {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 14px 16px;
    }

    .log-fields {
      flex: 1 1 460px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .log-form label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .log-form input {
      width: 100%;
      min-height: 48px;
      margin: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
      touch-action: manipulation;
    }

    .log-form input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .log-actions {
      display: flex;
      flex: none;
      gap: 8px;
    }

    .log-form button {
      margin: 0;
      min-height: 48px;
      padding: 12px 16px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--bg);
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .log-form button:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }

    #add-walk {
      background: transparent;
      color: var(--accent);
      box-shadow: inset 0 0 0 1.5px var(--accent);
    }

    /* Brief acknowledgement when a walk is added. */
    .rings.is-pulsing {
      animation: ring-pulse 0.7s ease;
    }

    @keyframes ring-pulse {
      0%,
      100% { transform: scale(1); filter: brightness(1); }
      40% { transform: scale(1.05); filter: brightness(1.35); }
    }

    @media (max-width: 639px) {
      .dashboard {
        padding:
          calc(18px + env(safe-area-inset-top))
          calc(16px + env(safe-area-inset-right))
          calc(36px + env(safe-area-inset-bottom))
          calc(16px + env(safe-area-inset-left));
      }

      .cols {
        grid-template-columns: 1fr;
      }

      .title {
        font-size: 36px;
      }

      .activity {
        padding: 18px 14px;
        gap: 20px;
      }

      .rings {
        width: 124px;
        height: 124px;
      }

      .metrics {
        gap: 24px;
      }

      .metric {
        gap: 8px;
      }

      .metric-label,
      .metric-value {
        font-size: 14px;
      }

      .stat-value {
        font-size: 32px;
      }

      .log-fields {
        grid-template-columns: 1fr 1fr;
      }

      .log-actions {
        width: 100%;
      }

      .log-actions button {
        flex: 1;
      }
    }

    @media (max-width: 360px) {
      .rings {
        width: 104px;
        height: 104px;
      }

      .metric-label,
      .metric-value {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ring-arc,
      .card {
        transition: none;
      }

      .bar,
      .rings.is-pulsing {
        animation: none;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="dashboard">
    <header class="header">
      <div>
        <p class="date">Monday, Mar 9</p>
        <h1 class="title">Summary</h1>
      </div>

      <svg class="avatar" viewBox="0 0 64 64" role="img" aria-label="Profile photo">
        <defs>
          <clipPath id="clip-user">
            <circle cx="32" cy="32" r="32"/>
          </clipPath>
        </defs>
        <g clip-path="url(#clip-user)">
          <rect width="64" height="64" fill="#3A2A22"/>
          <circle cx="32" cy="76" r="28" fill="#C46B45"/>
          <circle cx="32" cy="30" r="13" fill="#F0C2A2"/>
          <path fill="#2A2118" d="M18 30c1-14 7-19 14-19s13 5 14 19c-2-6-7-9-14-9s-12 3-14 9z"/>
        </g>
      </svg>
    </header>

    <form class="card log-form" id="log-form">
      <div class="log-fields">
        <label for="steps">Steps taken today
          <input id="steps" name="steps" type="number" min="0" step="1" inputmode="numeric" value="12484">
        </label>
        <label for="calories">Active energy (CAL)
          <input id="calories" name="calories" type="number" min="0" step="1" inputmode="numeric" value="858">
        </label>
        <label for="minutes">Exercise minutes
          <input id="minutes" name="minutes" type="number" min="0" step="1" inputmode="numeric" value="110">
        </label>
        <label for="hours">Stand hours
          <input id="hours" name="hours" type="number" min="0" step="1" inputmode="numeric" value="16">
        </label>
      </div>
      <div class="log-actions">
        <button type="submit">Update</button>
        <button type="button" id="add-walk">Add a walk</button>
      </div>
    </form>

    <!--
      Concentric rings, left side of the card. Move is outer, Exercise
      middle, Stand inner. Each arc is value / goal, capped at one full turn.
    -->
    <section class="card activity" aria-label="Activity">
      <div class="rings">
        <svg viewBox="0 0 220 220" role="img" aria-label="Move 858 of 700 calories, Exercise 110 of 30 minutes, Stand 16 of 10 hours. All three goals are complete.">
          <g transform="rotate(-90 110 110)">
            <circle class="ring-track ring-move" cx="110" cy="110" r="92"/>
            <circle class="ring-track ring-exercise" cx="110" cy="110" r="61"/>
            <circle class="ring-track ring-stand" cx="110" cy="110" r="30"/>

            <circle class="ring-arc ring-move" cx="110" cy="110" r="92"
              data-value="858" data-goal="700"
              stroke-dasharray="578.05" stroke-dashoffset="578.05"/>
            <circle class="ring-arc ring-exercise" cx="110" cy="110" r="61"
              data-value="110" data-goal="30"
              stroke-dasharray="383.27" stroke-dashoffset="383.27"/>
            <circle class="ring-arc ring-stand" cx="110" cy="110" r="30"
              data-value="16" data-goal="10"
              stroke-dasharray="188.50" stroke-dashoffset="188.50"/>
          </g>
        </svg>
      </div>

      <div class="metrics">
        <div class="metric">
          <span class="metric-label">Move</span>
          <span class="metric-value tone-move"><span id="move-value">858</span>/700<span class="unit">CAL</span></span>
        </div>
        <div class="metric">
          <span class="metric-label">Exercise</span>
          <span class="metric-value tone-exercise"><span id="exercise-value">110</span>/30<span class="unit">MIN</span></span>
        </div>
        <div class="metric">
          <span class="metric-label">Stand</span>
          <span class="metric-value tone-stand"><span id="stand-value">16</span>/10<span class="unit">HRS</span></span>
        </div>
      </div>
    </section>

    <section class="cols" aria-label="Step totals">
      <article class="card stat-steps">
        <div class="card-head">
          <h2>Step Count</h2>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="eyebrow eyebrow-stat">Today</p>
        <p class="stat-value" id="step-count">12,484</p>
        <div class="bars" id="step-bars" role="img" aria-label="Hourly steps today, with a spike around 5 PM"></div>
      </article>

      <article class="card stat-distance">
        <div class="card-head">
          <h2>Step Distance</h2>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="eyebrow eyebrow-stat">Today</p>
        <p class="stat-value"><span id="distance-value">5.87</span><span class="unit">MI</span></p>
        <div class="bars" id="distance-bars" role="img" aria-label="Hourly step distance today, with one spike around 5 PM"></div>
      </article>
    </section>

    <section class="cols" aria-label="Session and trainer">
      <article class="card">
        <h2>Sessions</h2>
        <div class="session-row">
          <div class="walk-orb" aria-hidden="true">
            <svg class="walk-icon" viewBox="0 0 24 24">
              <path fill="currentColor" d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9 7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7z"/>
            </svg>
          </div>
          <div>
            <h3 class="session-name">Outdoor Walk</h3>
            <p class="session-distance"><span id="walk-value">5.87</span><span class="unit">MI</span></p>
            <p class="eyebrow">Today</p>
          </div>
        </div>
      </article>

      <article class="card">
        <h2>Trainer Tips</h2>
        <h3 class="tip-heading">An easy way to use mindset for motivation</h3>
        <div class="byline">
          <svg class="avatar avatar-sm" viewBox="0 0 64 64" role="img" aria-label="Fitness+ Trainer">
            <defs>
              <clipPath id="clip-trainer">
                <circle cx="32" cy="32" r="32"/>
              </clipPath>
            </defs>
            <g clip-path="url(#clip-trainer)">
              <rect width="64" height="64" fill="#3A3224"/>
              <circle cx="32" cy="78" r="28" fill="#E0A15A"/>
              <circle cx="32" cy="34" r="13" fill="#E8B896"/>
              <path fill="#4A3428" d="M18 33c1-13 7-17 14-17s13 4 14 17c-2-6-7-9-14-9s-12 3-14 9z"/>
              <circle cx="32" cy="15" r="5" fill="#4A3428"/>
            </g>
          </svg>
          <span>with Fitness+ Trainer</span>
        </div>
      </article>
    </section>

    <section class="card awards" aria-labelledby="awards-title">
      <div class="card-head">
        <h2 id="awards-title">Awards</h2>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var GOALS = { calories: 700, minutes: 30, hours: 10 };
      var DEFAULTS = { steps: 12484, calories: 858, minutes: 110, hours: 16 };
      var STORAGE_KEY = "fitness-summary";
      var MILES_PER_STEP = 0.00047;
      /* Default step total fills the chart; other totals scale every bar from this. */
      var REFERENCE_STEPS = 12484;
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      var rings = document.querySelector(".rings");
      var ringSvg = rings.querySelector("svg");
      var arcs = {
        move: document.querySelector(".ring-arc.ring-move"),
        exercise: document.querySelector(".ring-arc.ring-exercise"),
        stand: document.querySelector(".ring-arc.ring-stand")
      };
      var fields = {
        steps: document.getElementById("steps"),
        calories: document.getElementById("calories"),
        minutes: document.getElementById("minutes"),
        hours: document.getElementById("hours")
      };

      /*
        24 hours, midnight through 11 PM. Values are percent of chart height
        at the reference step count. Overnight stays in the 15–25% band,
        the day climbs, and index 17 (5 PM) spikes. Distance uses the same shape.
      */
      var hourlyShape = [
        20, 18, 16, 15, 16, 18, 22, 28, 34, 38, 42, 46,
        50, 48, 54, 62, 72, 100, 58, 44, 36, 30, 24, 20
      ];

      function circumference(arc) {
        return 2 * Math.PI * arc.r.baseVal.value;
      }

      function amount(value) {
        var number = Number(value);
        if (!isFinite(number) || number < 0) return 0;
        return number;
      }

      function formatAmount(number) {
        var rounded = Math.round(number * 10) / 10;
        return String(rounded);
      }

      function formatSteps(number) {
        return Math.round(number).toLocaleString("en-US");
      }

      function formatMiles(steps) {
        return (steps * MILES_PER_STEP).toFixed(2);
      }

      function readForm() {
        return {
          steps: Math.round(amount(fields.steps.value)),
          calories: amount(fields.calories.value),
          minutes: amount(fields.minutes.value),
          hours: amount(fields.hours.value)
        };
      }

      function writeForm(state) {
        fields.steps.value = String(Math.round(state.steps));
        fields.calories.value = formatAmount(state.calories);
        fields.minutes.value = formatAmount(state.minutes);
        fields.hours.value = formatAmount(state.hours);
      }

      function loadState() {
        try {
          var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (!saved || typeof saved !== "object") return null;
          return {
            steps: amount(saved.steps),
            calories: amount(saved.calories),
            minutes: amount(saved.minutes),
            hours: amount(saved.hours)
          };
        } catch (error) {
          return null;
        }
      }

      function saveState(state) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (error) {
          /* Private mode can block storage; the live view still updates. */
        }
      }

      /* Arc length is value / goal, drawn with stroke-dashoffset and capped at one turn. */
      function ringTarget(arc, value, goal) {
        var length = circumference(arc);
        var ratio = goal > 0 ? Math.min(Math.max(value / goal, 0), 1) : 0;
        return {
          length: length,
          offset: ratio >= 0.999 ? 0 : length * (1 - ratio)
        };
      }

      function paintRing(arc, dash, offset) {
        var dashValue = dash + " " + dash;
        var offsetValue = String(offset);
        /* Attribute and style both, so iOS paints the new arc. */
        arc.setAttribute("stroke-dasharray", dashValue);
        arc.setAttribute("stroke-dashoffset", offsetValue);
        arc.style.strokeDasharray = dashValue;
        arc.style.strokeDashoffset = offsetValue;
      }

      function setRing(arc, value, goal, intro) {
        var geometry = ringTarget(arc, value, goal);
        arc.dataset.value = String(value);
        arc.dataset.goal = String(goal);
        arc.dataset.offset = String(geometry.offset);
        if (intro && !reduceMotion) {
          arc.style.transition = "none";
          paintRing(arc, geometry.length, geometry.length);
          return;
        }
        paintRing(arc, geometry.length, geometry.offset);
      }

      function hourName(index) {
        var hour = index % 12 || 12;
        var suffix = index < 12 ? "AM" : "PM";
        return hour + " " + suffix;
      }

      function scaledShape(steps) {
        var factor = REFERENCE_STEPS > 0 ? steps / REFERENCE_STEPS : 0;
        return hourlyShape.map(function (sample) {
          return Math.min(sample * factor, 100);
        });
      }

      function mountBars(container, samples) {
        var fragment = document.createDocumentFragment();
        samples.forEach(function (sample, index) {
          var bar = document.createElement("span");
          bar.className = "bar";
          bar.style.setProperty("--scale", String(sample / 100));
          bar.style.setProperty("--i", String(index));
          bar.title = hourName(index);
          fragment.appendChild(bar);
        });
        while (container.firstChild) container.removeChild(container.firstChild);
        container.appendChild(fragment);
      }

      var renderGeneration = 0;

      function render(state, intro) {
        var generation = ++renderGeneration;
        setRing(arcs.move, state.calories, GOALS.calories, intro);
        setRing(arcs.exercise, state.minutes, GOALS.minutes, intro);
        setRing(arcs.stand, state.hours, GOALS.hours, intro);
        if (intro && !reduceMotion) {
          void document.body.offsetWidth;
          Object.keys(arcs).forEach(function (name) {
            arcs[name].style.transition = "";
          });
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              if (generation !== renderGeneration) return;
              Object.keys(arcs).forEach(function (name) {
                var arc = arcs[name];
                var shown = arc.dataset.offset;
                arc.setAttribute("stroke-dashoffset", shown);
                arc.style.strokeDashoffset = shown;
              });
            });
          });
        }

        document.getElementById("move-value").textContent = formatAmount(state.calories);
        document.getElementById("exercise-value").textContent = formatAmount(state.minutes);
        document.getElementById("stand-value").textContent = formatAmount(state.hours);
        document.getElementById("step-count").textContent = formatSteps(state.steps);

        var miles = formatMiles(state.steps);
        document.getElementById("distance-value").textContent = miles;
        document.getElementById("walk-value").textContent = miles;

        var shape = scaledShape(state.steps);
        mountBars(document.getElementById("step-bars"), shape);
        mountBars(document.getElementById("distance-bars"), shape);

        ringSvg.setAttribute("aria-label",
          "Move " + formatAmount(state.calories) + " of " + GOALS.calories + " calories, " +
          "Exercise " + formatAmount(state.minutes) + " of " + GOALS.minutes + " minutes, " +
          "Stand " + formatAmount(state.hours) + " of " + GOALS.hours + " hours."
        );
      }

      function commit(state, intro) {
        writeForm(state);
        saveState(state);
        render(state, intro);
      }

      function pulseRings() {
        if (reduceMotion) return;
        rings.classList.remove("is-pulsing");
        void rings.offsetWidth;
        rings.classList.add("is-pulsing");
      }

      function showActivity() {
        var activity = document.querySelector(".activity");
        if (!activity || !activity.scrollIntoView) return;
        window.setTimeout(function () {
          activity.scrollIntoView({ block: "start", inline: "nearest" });
        }, 60);
      }

      var lastAction = 0;

      function applyAction(buildState, pulse) {
        var now = Date.now();
        if (now - lastAction < 700) return;
        lastAction = now;
        var active = document.activeElement;
        if (active && active.blur) active.blur();
        var state = buildState();
        commit(state, false);
        if (pulse) pulseRings();
        showActivity();
      }

      document.getElementById("log-form").addEventListener("submit", function (event) {
        event.preventDefault();
        applyAction(readForm, false);
      });

      /* A phone keyboard shifts the page, so the tap can miss the click. */
      document.querySelector("#log-form button[type='submit']").addEventListener("touchstart", function (event) {
        if (event.cancelable) event.preventDefault();
        applyAction(readForm, false);
      }, { passive: false });

      function addWalk() {
        applyAction(function () {
          var state = readForm();
          state.steps += 500 + Math.floor(Math.random() * 1501);
          state.minutes += 5 + Math.floor(Math.random() * 16);
          return state;
        }, true);
      }

      var addWalkButton = document.getElementById("add-walk");
      addWalkButton.addEventListener("click", addWalk);
      addWalkButton.addEventListener("touchstart", function (event) {
        if (event.cancelable) event.preventDefault();
        addWalk();
      }, { passive: false });

      rings.addEventListener("animationend", function () {
        rings.classList.remove("is-pulsing");
      });

      var initial = loadState() || DEFAULTS;
      writeForm(initial);
      render(initial, true);
    })();
  </script>
</body>
</html>
