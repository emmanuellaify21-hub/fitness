<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0B0F14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Summary">
  <title>Summary</title>
  <style>
    /*
      Theme tokens. Recolor the whole dashboard from this block.
      Coral, amber, and mint — swap any value and the panels follow.
    */
    :root {
      --bg: #0B0F14;
      --card: #161C24;
      --ring-move: #FF7847;
      --ring-exercise: #FFC24B;
      --ring-stand: #B8F7D4;
      --accent: #FFD166;
      --text: #FFFFFF;
      --text-dim: #9AA4B2;
      --line: color-mix(in srgb, var(--text) 10%, transparent);
      --radius: 28px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: clip;
      background:
        radial-gradient(900px 420px at 10% -10%, color-mix(in srgb, var(--ring-move) 8%, transparent), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: Bahnschrift, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    /* Page column. Paired cards live in .cols and collapse under 640px. */
    .dashboard {
      width: min(820px, 100%);
      margin: 0 auto;
      padding:
        calc(28px + env(safe-area-inset-top))
        calc(20px + env(safe-area-inset-right))
        calc(56px + env(safe-area-inset-bottom))
        calc(20px + env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    /* ---------- Header ---------- */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 4px 4px 6px;
    }

    .date {
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .title {
      margin-top: 2px;
      color: var(--text);
      font-size: 44px;
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.05;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: block;
      flex: none;
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--text) 14%, transparent);
    }

    .avatar-sm {
      width: 30px;
      height: 30px;
      box-shadow: none;
    }

    /* ---------- Cards ---------- */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px 22px 20px;
      -webkit-tap-highlight-color: transparent;
      transition: filter 180ms ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .card:hover {
        filter: brightness(1.14);
      }
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h2 {
      color: var(--text);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    .chevron {
      width: 18px;
      height: 18px;
      flex: none;
      color: var(--accent);
    }

    .eyebrow {
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 500;
    }

    .unit {
      font-size: 0.62em;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-left: 0.35em;
    }

    /* ---------- Activity rings ---------- */
    .activity {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px 32px;
      padding: 26px 28px;
    }

    .rings {
      width: 196px;
      height: 196px;
      flex: none;
    }

    .rings svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ring-track,
    .ring-arc {
      fill: none;
      stroke-width: 16;
      stroke-linecap: round;
    }

    /* Dim full-circle tracks sit under the progress arcs. */
    .ring-track {
      opacity: 0.22;
    }

    .ring-move { stroke: var(--ring-move); }
    .ring-exercise { stroke: var(--ring-exercise); }
    .ring-stand { stroke: var(--ring-stand); }

    .tone-move { color: var(--ring-move); }
    .tone-exercise { color: var(--ring-exercise); }
    .tone-stand { color: var(--ring-stand); }

    /*
      Draw-on animation. Arcs start fully hidden (dashoffset = dash length)
      and the script eases the offset to 0 on load. Stagger is outer → inner.
    */
    .ring-arc {
      transition: stroke-dashoffset 1.15s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ring-arc.ring-move { transition-delay: 0.05s; }
    .ring-arc.ring-exercise { transition-delay: 0.16s; }
    .ring-arc.ring-stand { transition-delay: 0.28s; }

    .metrics {
      flex: 1 1 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      min-width: 0;
    }

    .metric {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .metric-label {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .metric-value {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* ---------- Stat cards ---------- */
    .eyebrow-stat {
      margin-top: 14px;
    }

    .stat-value {
      margin-top: 2px;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .stat-distance .stat-value {
      color: var(--accent);
    }

    .bars {
      --chart-h: 72px;
      height: var(--chart-h);
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(24, minmax(0, 1fr));
      align-items: end;
      gap: 3px;
    }

    .stat-steps .bar {
      background: color-mix(in srgb, var(--text) 68%, var(--ring-stand));
    }

    .stat-distance .bar {
      background: var(--accent);
    }

    .bar {
      width: 100%;
      max-width: 5px;
      justify-self: center;
      height: calc(var(--scale) * var(--chart-h));
      border-radius: 999px;
      transform: scaleY(0);
      transform-origin: bottom center;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: calc(var(--i) * 32ms);
    }

    @keyframes rise {
      to { transform: scaleY(1); }
    }

    /* ---------- Sessions + trainer ---------- */
    .session-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 18px;
    }

    .walk-orb {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      flex: none;
      display: grid;
      place-items: center;
      color: var(--accent);
      background: radial-gradient(
        circle at 50% 42%,
        color-mix(in srgb, var(--accent) 34%, transparent),
        color-mix(in srgb, var(--accent) 8%, transparent) 72%
      );
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent),
        0 0 22px color-mix(in srgb, var(--accent) 45%, transparent);
    }

    .walk-icon {
      width: 30px;
      height: 30px;
      display: block;
    }

    .session-name {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    .session-distance {
      margin-top: 2px;
      color: var(--accent);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .session-row .eyebrow {
      margin-top: 2px;
    }

    .tip-heading {
      margin-top: 14px;
      max-width: 18ch;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.25;
    }

    .byline {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 500;
    }

    .awards {
      padding-top: 20px;
      padding-bottom: 20px;
    }

    @media (max-width: 639px) {
      .dashboard {
        padding:
          calc(18px + env(safe-area-inset-top))
          calc(16px + env(safe-area-inset-right))
          calc(36px + env(safe-area-inset-bottom))
          calc(16px + env(safe-area-inset-left));
      }

      .cols {
        grid-template-columns: 1fr;
      }

      .title {
        font-size: 36px;
      }

      .activity {
        padding: 18px 14px;
        gap: 12px;
      }

      .rings {
        width: 124px;
        height: 124px;
      }

      .metrics {
        flex-basis: 0;
        gap: 14px;
      }

      .metric {
        gap: 8px;
      }

      .metric-label,
      .metric-value {
        font-size: 14px;
      }

      .stat-value {
        font-size: 32px;
      }
    }

    @media (max-width: 360px) {
      .rings {
        width: 104px;
        height: 104px;
      }

      .metric-label,
      .metric-value {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ring-arc,
      .card {
        transition: none;
      }

      .bar {
        animation: none;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="dashboard">
    <header class="header">
      <div>
        <p class="date">Monday, Mar 9</p>
        <h1 class="title">Summary</h1>
      </div>

      <svg class="avatar" viewBox="0 0 64 64" role="img" aria-label="Profile photo">
        <defs>
          <clipPath id="clip-user">
            <circle cx="32" cy="32" r="32"/>
          </clipPath>
        </defs>
        <g clip-path="url(#clip-user)">
          <rect width="64" height="64" fill="#3A2A22"/>
          <circle cx="32" cy="76" r="28" fill="#C46B45"/>
          <circle cx="32" cy="30" r="13" fill="#F0C2A2"/>
          <path fill="#2A2118" d="M18 30c1-14 7-19 14-19s13 5 14 19c-2-6-7-9-14-9s-12 3-14 9z"/>
        </g>
      </svg>
    </header>

    <!--
      Concentric rings, left side of the card. Move is outer, Exercise
      middle, Stand inner. Goals are already past 100%, so each arc closes.
      Totals stay in the rows on the right.
    -->
    <section class="card activity" aria-label="Activity">
      <div class="rings">
        <svg viewBox="0 0 220 220" role="img" aria-label="Move 858 of 700 calories, Exercise 110 of 30 minutes, Stand 16 of 10 hours. All three goals are complete.">
          <g transform="rotate(-90 110 110)">
            <circle class="ring-track ring-move" cx="110" cy="110" r="92"/>
            <circle class="ring-track ring-exercise" cx="110" cy="110" r="70"/>
            <circle class="ring-track ring-stand" cx="110" cy="110" r="48"/>

            <circle class="ring-arc ring-move" cx="110" cy="110" r="92"
              data-value="858" data-goal="700"
              stroke-dasharray="578.05" stroke-dashoffset="578.05"/>
            <circle class="ring-arc ring-exercise" cx="110" cy="110" r="70"
              data-value="110" data-goal="30"
              stroke-dasharray="439.82" stroke-dashoffset="439.82"/>
            <circle class="ring-arc ring-stand" cx="110" cy="110" r="48"
              data-value="16" data-goal="10"
              stroke-dasharray="301.59" stroke-dashoffset="301.59"/>
          </g>
        </svg>
      </div>

      <div class="metrics">
        <div class="metric">
          <span class="metric-label">Move</span>
          <span class="metric-value tone-move">858/700<span class="unit">CAL</span></span>
        </div>
        <div class="metric">
          <span class="metric-label">Exercise</span>
          <span class="metric-value tone-exercise">110/30<span class="unit">MIN</span></span>
        </div>
        <div class="metric">
          <span class="metric-label">Stand</span>
          <span class="metric-value tone-stand">16/10<span class="unit">HRS</span></span>
        </div>
      </div>
    </section>

    <section class="cols" aria-label="Step totals">
      <article class="card stat-steps">
        <div class="card-head">
          <h2>Step Count</h2>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="eyebrow eyebrow-stat">Today</p>
        <p class="stat-value">12,484</p>
        <div class="bars" id="step-bars" role="img" aria-label="Hourly steps today, with a spike around 5 PM"></div>
      </article>

      <article class="card stat-distance">
        <div class="card-head">
          <h2>Step Distance</h2>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="eyebrow eyebrow-stat">Today</p>
        <p class="stat-value">5.80<span class="unit">MI</span></p>
        <div class="bars" id="distance-bars" role="img" aria-label="Hourly step distance today, with one spike around 5 PM"></div>
      </article>
    </section>

    <section class="cols" aria-label="Session and trainer">
      <article class="card">
        <h2>Sessions</h2>
        <div class="session-row">
          <div class="walk-orb" aria-hidden="true">
            <svg class="walk-icon" viewBox="0 0 24 24">
              <path fill="currentColor" d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9 7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7z"/>
            </svg>
          </div>
          <div>
            <h3 class="session-name">Outdoor Walk</h3>
            <p class="session-distance">2.04<span class="unit">MI</span></p>
            <p class="eyebrow">Today</p>
          </div>
        </div>
      </article>

      <article class="card">
        <h2>Trainer Tips</h2>
        <h3 class="tip-heading">An easy way to use mindset for motivation</h3>
        <div class="byline">
          <svg class="avatar avatar-sm" viewBox="0 0 64 64" role="img" aria-label="Fitness+ Trainer">
            <defs>
              <clipPath id="clip-trainer">
                <circle cx="32" cy="32" r="32"/>
              </clipPath>
            </defs>
            <g clip-path="url(#clip-trainer)">
              <rect width="64" height="64" fill="#3A3224"/>
              <circle cx="32" cy="78" r="28" fill="#E0A15A"/>
              <circle cx="32" cy="34" r="13" fill="#E8B896"/>
              <path fill="#4A3428" d="M18 33c1-13 7-17 14-17s13 4 14 17c-2-6-7-9-14-9s-12 3-14 9z"/>
              <circle cx="32" cy="15" r="5" fill="#4A3428"/>
            </g>
          </svg>
          <span>with Fitness+ Trainer</span>
        </div>
      </article>
    </section>

    <section class="card awards" aria-labelledby="awards-title">
      <div class="card-head">
        <h2 id="awards-title">Awards</h2>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var arcs = document.querySelectorAll(".ring-arc");
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function circumference(arc) {
        return 2 * Math.PI * arc.r.baseVal.value;
      }

      /*
        Goals are over 100%, so each ring draws one full revolution.
        A few extra pixels of dash overlap the seam; round caps would
        otherwise leave a hairline gap at 12 o'clock.
      */
      function ringGeometry(arc) {
        var length = circumference(arc);
        var ratio = Math.min(Math.max(Number(arc.dataset.value) / Number(arc.dataset.goal), 0), 1);
        var dash = length * ratio + (ratio >= 0.999 ? 14 : 0);
        return { length: length, dash: dash };
      }

      arcs.forEach(function (arc) {
        var geometry = ringGeometry(arc);
        arc.style.transition = "none";
        arc.style.strokeDasharray = geometry.dash + " " + geometry.length;
        arc.style.strokeDashoffset = String(geometry.dash);
      });

      void document.body.offsetWidth;
      arcs.forEach(function (arc) {
        arc.style.transition = "";
      });

      function drawRings() {
        arcs.forEach(function (arc) {
          arc.style.strokeDashoffset = "0";
        });
      }

      if (reduceMotion) {
        drawRings();
      } else {
        requestAnimationFrame(function () {
          requestAnimationFrame(drawRings);
        });
      }

      /* 24 hours, midnight through 11 PM. Index 17 is 5 PM — the day's spike. */
      var stepHours = [
        8, 5, 4, 3, 4, 7, 12, 18, 26, 16, 12, 14,
        20, 14, 11, 16, 24, 100, 32, 18, 12, 9, 7, 5
      ];
      var distanceHours = [
        6, 4, 3, 3, 4, 6, 10, 14, 18, 12, 10, 12,
        16, 11, 8, 12, 20, 100, 28, 14, 10, 7, 5, 4
      ];

      function hourName(index) {
        var hour = index % 12 || 12;
        var suffix = index < 12 ? "AM" : "PM";
        return hour + " " + suffix;
      }

      function mountBars(container, samples) {
        var fragment = document.createDocumentFragment();
        samples.forEach(function (sample, index) {
          var bar = document.createElement("span");
          bar.className = "bar";
          bar.style.setProperty("--scale", String(Math.max(sample, 6) / 100));
          bar.style.setProperty("--i", String(index));
          bar.title = hourName(index);
          fragment.appendChild(bar);
        });
        container.appendChild(fragment);
      }

      mountBars(document.getElementById("step-bars"), stepHours);
      mountBars(document.getElementById("distance-bars"), distanceHours);
    })();
  </script>
</body>
</html>
